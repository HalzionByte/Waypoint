# Fly.io config for WayPoint.
#   fly launch --no-deploy --copy-config   (or just edit this file)
#   fly volumes create waypoint_data --size 1
#   fly secrets set JWT_SECRET=... PUBLIC_BASE_URL=https://your-app.fly.dev
#   fly deploy

app = "waypoint"
primary_region = "syd"   # Karachi-friendly; change to your nearest region

[build]
  dockerfile = "Dockerfile"

[env]
  # SQLite and photos on the volume, so both survive restarts and redeploys.
  DATABASE_URL = "sqlite:////data/waypoint.db"
  UPLOAD_DIR = "/data/uploads"
  STATIC_DIR = "/app/static"
  # The demo account and sample routes are created on first boot.
  SEED_DEMO_DATA = "true"
  # Visitors are signed into the demo account automatically — no login wall.
  # Set to "false" the moment this is a real deployment.
  DEMO_AUTO_LOGIN = "true"
  VERIFICATION_DAYS = "180"

[[mounts]]
  source = "waypoint_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # judges should never hit a cold start
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
